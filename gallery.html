<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MDJ Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080c0e;
      --surface: rgba(15, 21, 24, 0.88);
      --surface-strong: rgba(22, 29, 32, 0.96);
      --ink: #edf4f1;
      --muted: #9baaa5;
      --soft: #6f7e79;
      --line: rgba(255, 255, 255, 0.13);
      --line-strong: rgba(255, 255, 255, 0.25);
      --accent: #35d09f;
      --accent-2: #79adea;
      --warn: #d8ad59;
      --bad: #ff8475;
      --shadow: 0 22px 72px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background:
        linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        var(--bg);
      background-size: 48px 48px;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button,
    .action,
    .model-button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: rgba(8, 12, 14, 0.82);
    }

    .sidebar-head {
      padding: max(20px, env(safe-area-inset-top)) 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 760;
      line-height: 1.1;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .search {
      width: 100%;
      height: 40px;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
      padding: 0 12px;
      outline: none;
    }

    .search:focus {
      border-color: rgba(121, 173, 234, 0.72);
      box-shadow: 0 0 0 3px rgba(121, 173, 234, 0.16);
    }

    .model-list {
      display: grid;
      gap: 8px;
      overflow: auto;
      padding: 12px;
    }

    .model-button {
      width: 100%;
      min-height: 68px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--ink);
      cursor: pointer;
      padding: 12px;
      text-align: left;
    }

    .model-button:hover {
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.075);
    }

    .model-button:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
    }

    .model-button[aria-current="true"] {
      border-color: rgba(53, 208, 159, 0.72);
      background: rgba(53, 208, 159, 0.12);
    }

    .model-name {
      display: block;
      overflow: hidden;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .workspace {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-height: 100vh;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 12, 14, 0.72);
      backdrop-filter: blur(18px) saturate(132%);
      -webkit-backdrop-filter: blur(18px) saturate(132%);
    }

    .model-heading {
      min-width: 0;
    }

    .model-heading strong {
      display: block;
      overflow: hidden;
      font-size: 17px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      display: block;
      overflow: hidden;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status[data-tone="good"] {
      color: var(--accent);
    }

    .status[data-tone="bad"] {
      color: var(--bad);
    }

    .actions {
      display: flex;
      flex: none;
      gap: 8px;
    }

    .action {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.075);
      color: var(--ink);
      cursor: pointer;
      padding: 0 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    .action:hover {
      border-color: rgba(255, 255, 255, 0.32);
      background: rgba(255, 255, 255, 0.12);
    }

    .action:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
    }

    .action.primary {
      border-color: rgba(53, 208, 159, 0.56);
      background: rgba(53, 208, 159, 0.17);
    }

    .action.disabled,
    .action[aria-disabled="true"] {
      color: rgba(237, 244, 241, 0.44);
      border-color: rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.04);
      cursor: default;
      pointer-events: auto;
    }

    .quicklook-image {
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .preview {
      position: relative;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px),
        #0a0f12;
      background-size: 44px 44px;
    }

    #previewCanvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(237, 244, 241, 0.58);
      font-size: 18px;
      font-weight: 720;
      pointer-events: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      overflow: hidden;
      border-top: 1px solid var(--line);
      background: var(--line);
    }

    .stat {
      min-width: 0;
      padding: 12px 14px;
      background: var(--surface);
    }

    .stat span {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stat strong {
      display: block;
      overflow: hidden;
      margin-top: 5px;
      font-size: 15px;
      line-height: 1.18;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: 0;
        max-height: 42vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .workspace {
        min-height: 58vh;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .action {
        flex: 1;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="MDJ gallery">
    <aside class="sidebar" aria-label="Models">
      <div class="sidebar-head">
        <div class="sidebar-title">
          <h1>MDJ Gallery</h1>
          <span id="modelCount" class="count">0 models</span>
        </div>
        <input id="searchInput" class="search" type="search" placeholder="Search models" autocomplete="off">
      </div>
      <div id="modelList" class="model-list"></div>
    </aside>

    <section class="workspace" aria-label="Selected model">
      <header class="topbar">
        <div class="model-heading">
          <strong id="selectedName">No model loaded</strong>
          <span id="status" class="status">Loading gallery...</span>
        </div>
        <div class="actions">
          <a id="viewerLink" class="action" aria-disabled="true">Open Viewer</a>
          <a id="arLink" class="action primary disabled" aria-disabled="true">
            <img id="quickLookImage" class="quicklook-image" alt="">
            <span id="arText">View in AR</span>
          </a>
        </div>
      </header>

      <section class="preview" aria-label="Model preview">
        <canvas id="previewCanvas"></canvas>
        <div id="emptyState" class="empty-state">No model loaded</div>
      </section>

      <section class="stats" aria-label="Model stats">
        <div class="stat">
          <span>Meshes</span>
          <strong id="meshStat">-</strong>
        </div>
        <div class="stat">
          <span>Triangles</span>
          <strong id="triangleStat">-</strong>
        </div>
        <div class="stat">
          <span>References</span>
          <strong id="referenceStat">-</strong>
        </div>
        <div class="stat">
          <span>Span</span>
          <strong id="spanStat">-</strong>
        </div>
      </section>
    </section>
  </main>

  <script src="mdj-usdz-core.js"></script>
  <script>
  (() => {
    "use strict";

    const EMBEDDED_MDJS = [
      "160B-M3 Stile Spreader.mdj",
      "412B-M1 Rip-One.mdj",
      "414A- Cameron Gang Rip Saw V13.mdj",
      "717C-M1-DC V1 Door Clamp.mdj",
      "79F-6-PC Tubing Rack.mdj",
      "80Y-M3 Super Auto-Clamp.mdj"
    ];

    const tinyGif = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
    const canvas = document.getElementById("previewCanvas");
    const modelList = document.getElementById("modelList");
    const modelCount = document.getElementById("modelCount");
    const searchInput = document.getElementById("searchInput");
    const selectedName = document.getElementById("selectedName");
    const statusEl = document.getElementById("status");
    const emptyState = document.getElementById("emptyState");
    const viewerLink = document.getElementById("viewerLink");
    const arLink = document.getElementById("arLink");
    const arText = document.getElementById("arText");
    const quickLookImage = document.getElementById("quickLookImage");
    const meshStat = document.getElementById("meshStat");
    const triangleStat = document.getElementById("triangleStat");
    const referenceStat = document.getElementById("referenceStat");
    const spanStat = document.getElementById("spanStat");

    const state = {
      files: [],
      filteredFiles: [],
      selectedFile: "",
      model: null,
      loadToken: 0,
      busy: false,
      objectUrl: "",
      objectUrlFile: "",
      objectUrlDownloadName: "",
      usdzPromise: null,
      usdzPromiseFile: "",
      webXRSupported: false,
      webXRChecked: false
    };

    const iOSDevice = isIOSDevice();
    const safariBrowser = isSafariBrowser();
    const quickLookCapable = iOSDevice && safariBrowser && isAppleQuickLookCapable();
    const appleUSDZCapable = quickLookCapable;
    const openInSafariCapable = iOSDevice && !safariBrowser;
    const INCHES_TO_METERS = 0.0254;
    let renderer = null;

    async function boot() {
      quickLookImage.src = tinyGif;
      wireEvents();

      if (!window.MDJUSDZ) {
        setStatus("MDJ converter core did not load.", "bad");
        return;
      }

      renderer = createPreviewRenderer(canvas);
      renderer.start();
      updateWebXRSupport();

      state.files = await discoverFiles();
      renderList();

      const requestedFile = new URLSearchParams(window.location.search).get("file");
      const initialFile = matchRequestedFile(requestedFile) || state.files[0] || "";
      if (initialFile) {
        selectFile(initialFile, { updateUrl: false });
      } else {
        setStatus("No MDJ files found.", "bad");
      }
    }

    function wireEvents() {
      searchInput.addEventListener("input", renderList);
      window.addEventListener("beforeunload", revokeObjectUrl);

      viewerLink.addEventListener("click", (event) => {
        if (isDisabled(viewerLink)) {
          event.preventDefault();
        }
      });

      arLink.addEventListener("click", async (event) => {
        if (!state.model || !state.selectedFile) {
          event.preventDefault();
          setStatus("Load a model before opening AR.", "bad");
          return;
        }

        if (openInSafariCapable) {
          return;
        }

        if (!appleUSDZCapable) {
          event.preventDefault();
          if (isDisabled(arLink)) {
            setStatus(arLink.title || "WebXR AR is unavailable on this device.", "bad");
            return;
          }

          try {
            await renderer.startAR();
          } catch (error) {
            setStatus(webXRErrorMessage(error), "bad");
          }
          return;
        }

        if (state.objectUrl && state.objectUrlFile === state.selectedFile) {
          return;
        }

        event.preventDefault();
        const ready = await prepareUSDZ(true);
        if (ready) {
          setStatus("USDZ is ready. Tap View in AR again.", "good");
        }
      });
    }

    async function updateWebXRSupport() {
      if (appleUSDZCapable) {
        state.webXRSupported = false;
        state.webXRChecked = true;
        return;
      }

      try {
        state.webXRSupported = Boolean(
          navigator.xr &&
          navigator.xr.isSessionSupported &&
          await navigator.xr.isSessionSupported("immersive-ar")
        );
      } catch {
        state.webXRSupported = false;
      }

      state.webXRChecked = true;
      configureLinks();
    }

    async function discoverFiles() {
      const files = new Set();
      addFiles(files, EMBEDDED_MDJS);

      const manifestFiles = await readManifest();
      addFiles(files, manifestFiles);

      const directoryFiles = await readDirectoryIndex();
      addFiles(files, directoryFiles);

      return Array.from(files).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    }

    async function readManifest() {
      try {
        const response = await fetch("mdj-gallery-manifest.json", { cache: "no-store" });
        if (!response.ok) {
          return [];
        }
        const manifest = await response.json();
        return Array.isArray(manifest) ? manifest : manifest.files;
      } catch {
        return [];
      }
    }

    async function readDirectoryIndex() {
      if (window.location.protocol === "file:") {
        return [];
      }

      try {
        const response = await fetch(new URL(".", window.location.href).href, { cache: "no-store" });
        if (!response.ok) {
          return [];
        }
        const html = await response.text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        const files = [];
        for (const anchor of doc.querySelectorAll("a[href]")) {
          const href = anchor.getAttribute("href") || "";
          const fileName = fileNameFromHref(href);
          if (fileName) {
            files.push(fileName);
          }
        }
        return files;
      } catch {
        return [];
      }
    }

    function addFiles(target, files) {
      if (!Array.isArray(files)) {
        return;
      }
      for (const file of files) {
        const clean = String(file || "").trim();
        if (clean && clean.toLowerCase().endsWith(".mdj")) {
          target.add(clean);
        }
      }
    }

    function fileNameFromHref(href) {
      try {
        const url = new URL(href, window.location.href);
        const fileName = decodeURIComponent(url.pathname.split("/").pop() || "");
        return fileName.toLowerCase().endsWith(".mdj") ? fileName : "";
      } catch {
        return "";
      }
    }

    function matchRequestedFile(fileName) {
      if (!fileName) {
        return "";
      }
      const decoded = decodeURIComponent(fileName);
      return state.files.find((file) => file === decoded) || "";
    }

    function renderList() {
      const query = searchInput.value.trim().toLowerCase();
      state.filteredFiles = state.files.filter((file) => file.toLowerCase().includes(query));
      modelCount.textContent = `${state.files.length} ${state.files.length === 1 ? "model" : "models"}`;
      modelList.replaceChildren();

      const fragment = document.createDocumentFragment();
      for (const file of state.filteredFiles) {
        const button = document.createElement("button");
        button.className = "model-button";
        button.type = "button";
        button.dataset.file = file;
        button.setAttribute("aria-current", file === state.selectedFile ? "true" : "false");
        button.innerHTML = `
          <span class="model-name"></span>
          <span class="model-meta">
            <span>MDJ</span>
            <span></span>
          </span>
        `;
        button.querySelector(".model-name").textContent = displayName(file);
        button.querySelector(".model-meta span:last-child").textContent = file;
        button.addEventListener("click", () => selectFile(file));
        fragment.appendChild(button);
      }

      modelList.appendChild(fragment);
    }

    async function selectFile(fileName, options) {
      const opts = options || {};
      const token = state.loadToken + 1;
      state.loadToken = token;
      state.selectedFile = fileName;
      state.model = null;
      state.busy = true;
      revokeObjectUrl();
      renderer.setModel(null);
      updateStats(null);
      emptyState.style.display = "";
      selectedName.textContent = displayName(fileName);
      setStatus(`Loading ${fileName}...`);
      configureLinks();
      renderList();

      if (opts.updateUrl !== false) {
        const url = new URL(window.location.href);
        url.searchParams.set("file", fileName);
        window.history.replaceState(null, "", url.href);
      }

      try {
        const response = await fetch(resolveModelUrl(fileName).href);
        if (!response.ok) {
          throw new Error(`Could not fetch ${fileName}.`);
        }
        const text = await response.text();
        if (token !== state.loadToken) {
          return;
        }

        const model = MDJUSDZ.parseMDJText(text, { fileName });
        if (token !== state.loadToken) {
          return;
        }

        state.model = model;
        renderer.setModel(model);
        emptyState.style.display = "none";
        updateStats(model);
        configureLinks();
        setStatus(`Loaded ${fileName}.`, "good");

        if (appleUSDZCapable) {
          prepareUSDZ(false);
        }
      } catch (error) {
        if (token !== state.loadToken) {
          return;
        }
        state.model = null;
        renderer.setModel(null);
        emptyState.style.display = "";
        updateStats(null);
        configureLinks();
        setStatus(error.message || "Could not load MDJ.", "bad");
      } finally {
        if (token === state.loadToken) {
          state.busy = false;
        }
      }
    }

    function resolveModelUrl(fileName) {
      const encodedPath = fileName.split("/").map((part) => encodeURIComponent(part)).join("/");
      return new URL(encodedPath, window.location.href);
    }

    function configureLinks() {
      if (!state.selectedFile || !state.model) {
        disableLink(viewerLink);
        disableLink(arLink);
        arLink.removeAttribute("rel");
        return;
      }

      viewerLink.href = viewerUrl(state.selectedFile);
      enableLink(viewerLink);

      if (openInSafariCapable) {
        arLink.removeAttribute("rel");
        arLink.removeAttribute("download");
        arLink.removeAttribute("aria-label");
        arText.textContent = "Open in Safari for AR";
        const safariUrl = safariUrlForCurrentModel();
        if (safariUrl) {
          arLink.href = safariUrl;
          enableLink(arLink);
          arLink.title = "Open this model in Safari for AR Quick Look.";
        } else {
          disableLink(arLink);
          arLink.title = "Open this page in Safari to use AR.";
        }
        return;
      }

      if (appleUSDZCapable) {
        arText.textContent = state.objectUrl && state.objectUrlFile === state.selectedFile ? "View in AR" : "Preparing AR";
        if (state.objectUrl && state.objectUrlFile === state.selectedFile) {
          arLink.href = quickLookUrl(state.objectUrl);
          arLink.setAttribute("rel", "ar");
          arLink.setAttribute("aria-label", "Open model in AR Quick Look");
          arLink.removeAttribute("download");
          arLink.title = "Open in Apple AR Quick Look.";
          enableLink(arLink);
        } else {
          arLink.removeAttribute("href");
          arLink.removeAttribute("download");
          arLink.setAttribute("rel", "ar");
          arLink.setAttribute("aria-label", "Preparing model for AR Quick Look");
          disableLink(arLink);
          arLink.title = "Preparing USDZ...";
        }
        return;
      }

      arLink.removeAttribute("rel");
      arLink.removeAttribute("download");
      arText.textContent = "View in AR";
      arLink.removeAttribute("href");
      if (state.webXRSupported) {
        enableLink(arLink);
        arLink.title = "Start WebXR AR placement.";
      } else {
        disableLink(arLink);
        arLink.title = state.webXRChecked
          ? "WebXR AR is unavailable on this device. Use Open Viewer for the 3D preview."
          : "Checking WebXR AR support...";
      }
    }

    function viewerUrl(fileName) {
      return `mdj-ar-viewer.html?file=${encodeURIComponent(fileName)}`;
    }

    function safariUrlForCurrentModel() {
      if (window.location.protocol !== "https:" && window.location.protocol !== "http:") {
        return "";
      }

      const url = new URL(window.location.href);
      if (state.selectedFile) {
        url.searchParams.set("file", state.selectedFile);
      }
      return `x-safari-${url.href}`;
    }

    async function prepareUSDZ(openAfter) {
      if (!state.model || !state.selectedFile || !appleUSDZCapable) {
        return false;
      }

      if (state.objectUrl && state.objectUrlFile === state.selectedFile) {
        return true;
      }

      if (state.usdzPromise && state.usdzPromiseFile === state.selectedFile) {
        return Boolean(await state.usdzPromise);
      }

      const token = state.loadToken;
      setStatus("Preparing Apple AR...");
      arText.textContent = "Preparing AR";
      disableLink(arLink);

      state.usdzPromiseFile = state.selectedFile;
      state.usdzPromise = (async () => {
        await nextFrame();
        const result = MDJUSDZ.exportUSDZ(state.model, {
          fileName: state.selectedFile,
          units: "in",
          precision: 6
        });
        if (token !== state.loadToken) {
          return false;
        }

        revokeObjectUrl();
        const usdz = typeof File === "function"
          ? new File([result.bytes], result.fileName, { type: result.mimeType })
          : new Blob([result.bytes], { type: result.mimeType });
        state.objectUrl = URL.createObjectURL(usdz);
        state.objectUrlFile = state.selectedFile;
        state.objectUrlDownloadName = result.fileName;
        configureLinks();
        setStatus(`Created ${result.fileName}.`, "good");
        return true;
      })();

      try {
        const ready = await state.usdzPromise;
        return Boolean(ready);
      } catch (error) {
        if (token === state.loadToken) {
          configureLinks();
          setStatus(error.message || "Could not create USDZ.", "bad");
        }
        return false;
      } finally {
        if (state.usdzPromiseFile === state.selectedFile) {
          state.usdzPromise = null;
          state.usdzPromiseFile = "";
        }
      }
    }

    function quickLookUrl(objectUrl) {
      return `${objectUrl}#allowsContentScaling=0`;
    }

    function revokeObjectUrl() {
      if (state.objectUrl) {
        URL.revokeObjectURL(state.objectUrl);
      }
      state.objectUrl = "";
      state.objectUrlFile = "";
      state.objectUrlDownloadName = "";
      state.usdzPromise = null;
      state.usdzPromiseFile = "";
    }

    function enableLink(link) {
      link.classList.remove("disabled");
      link.removeAttribute("aria-disabled");
      link.removeAttribute("tabindex");
    }

    function disableLink(link) {
      link.removeAttribute("href");
      link.classList.add("disabled");
      link.setAttribute("aria-disabled", "true");
      link.setAttribute("tabindex", "-1");
    }

    function isDisabled(link) {
      return link.classList.contains("disabled") || link.getAttribute("aria-disabled") === "true";
    }

    function updateStats(model) {
      if (!model) {
        meshStat.textContent = "-";
        triangleStat.textContent = "-";
        referenceStat.textContent = "-";
        spanStat.textContent = "-";
        return;
      }

      meshStat.textContent = formatNumber(model.meshCount);
      triangleStat.textContent = formatNumber(model.triangleCount);
      referenceStat.textContent = formatNumber(model.referenceCount);
      spanStat.textContent = `${formatSpan(model.span[0])} x ${formatSpan(model.span[1])} x ${formatSpan(model.span[2])} in`;
    }

    function displayName(fileName) {
      return String(fileName || "MDJ Model").replace(/\.mdj$/i, "");
    }

    function setStatus(text, tone) {
      statusEl.textContent = text;
      statusEl.dataset.tone = tone || "";
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("en-US").format(value || 0);
    }

    function formatSpan(value) {
      const number = Number(value) || 0;
      if (Math.abs(number) >= 100) {
        return number.toFixed(0);
      }
      if (Math.abs(number) >= 10) {
        return number.toFixed(1);
      }
      return number.toFixed(3).replace(/\.?0+$/, "");
    }

    function nextFrame() {
      return new Promise((resolve) => requestAnimationFrame(resolve));
    }

    function webXRErrorMessage(error) {
      const message = error && error.message ? error.message : "";
      if (/user activation/i.test(message)) {
        return "Tap View in AR to start WebXR AR.";
      }
      if (/not supported|unsupported|unavailable/i.test(message)) {
        return "WebXR AR is unavailable on this device. Use Open Viewer for the 3D preview.";
      }
      return message || "Could not start WebXR AR.";
    }

    function isIOSDevice() {
      const userAgent = navigator.userAgent || "";
      const platform = navigator.platform || "";
      return /iPad|iPhone|iPod/i.test(userAgent) || (platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function isSafariBrowser() {
      const userAgent = navigator.userAgent || "";
      return /Safari/i.test(userAgent) && !/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo|YaBrowser/i.test(userAgent);
    }

    function isAppleQuickLookCapable() {
      const anchor = document.createElement("a");
      const relSupportsAR = anchor.relList && typeof anchor.relList.supports === "function" && anchor.relList.supports("ar");
      return Boolean(relSupportsAR && iOSDevice);
    }

    function createPreviewRenderer(targetCanvas) {
      const gl = targetCanvas.getContext("webgl", {
        alpha: true,
        antialias: true,
        depth: true,
        xrCompatible: true
      });
      if (!gl) {
        setStatus("WebGL preview is unavailable.", "bad");
        return {
          setModel() {},
          start() {},
          async startAR() {
            throw new Error("WebGL is required for WebXR AR.");
          }
        };
      }

      const math = MDJUSDZ.math;
      const program = createProgram(gl, `
        attribute vec3 aPosition;
        attribute vec3 aNormal;
        uniform mat4 uProjection;
        uniform mat4 uView;
        uniform mat4 uModel;
        varying vec3 vNormal;
        void main() {
          vec4 worldPosition = uModel * vec4(aPosition, 1.0);
          vNormal = mat3(uModel) * aNormal;
          gl_Position = uProjection * uView * worldPosition;
        }
      `, `
        precision mediump float;
        uniform vec4 uColor;
        uniform vec3 uLightDirection;
        varying vec3 vNormal;
        void main() {
          vec3 normal = normalize(vNormal);
          float light = max(dot(normal, normalize(uLightDirection)), 0.0);
          vec3 color = uColor.rgb * (0.25 + light * 0.75);
          vec3 rim = vec3(0.11, 0.15, 0.17) * pow(1.0 - abs(normal.z), 2.0);
          gl_FragColor = vec4(color + rim, uColor.a);
        }
      `);

      const locations = {
        position: gl.getAttribLocation(program, "aPosition"),
        normal: gl.getAttribLocation(program, "aNormal"),
        projection: gl.getUniformLocation(program, "uProjection"),
        view: gl.getUniformLocation(program, "uView"),
        model: gl.getUniformLocation(program, "uModel"),
        color: gl.getUniformLocation(program, "uColor"),
        lightDirection: gl.getUniformLocation(program, "uLightDirection")
      };

      const projection = new Float32Array(16);
      const view = new Float32Array(16);
      let activeModel = null;
      let yaw = -0.72;
      let pitch = -0.34;
      let zoom = 2.9;
      let pointer = null;
      let xrSession = null;
      let xrReferenceSpace = null;
      let xrViewerSpace = null;
      let xrHitTestSource = null;
      let xrReticleVisible = false;
      let xrModelPlaced = false;
      let xrHitSeen = false;
      let xrNoHitTimer = null;
      let reticleGeometry = null;
      const xrHitMatrix = new Float32Array(16);
      const xrPlacedMatrix = new Float32Array(16);
      identity(xrHitMatrix);
      identity(xrPlacedMatrix);

      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LEQUAL);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.disable(gl.CULL_FACE);
      gl.clearColor(0, 0, 0, 0);

      targetCanvas.addEventListener("pointerdown", (event) => {
        pointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
        targetCanvas.setPointerCapture(event.pointerId);
      });

      targetCanvas.addEventListener("pointermove", (event) => {
        if (!pointer || pointer.id !== event.pointerId) {
          return;
        }
        const dx = event.clientX - pointer.x;
        const dy = event.clientY - pointer.y;
        pointer.x = event.clientX;
        pointer.y = event.clientY;
        yaw += dx * 0.009;
        pitch = Math.max(-1.25, Math.min(1.25, pitch + dy * 0.007));
      });

      targetCanvas.addEventListener("pointerup", () => {
        pointer = null;
      });

      targetCanvas.addEventListener("pointercancel", () => {
        pointer = null;
      });

      targetCanvas.addEventListener("wheel", (event) => {
        event.preventDefault();
        const direction = event.deltaY > 0 ? 1 : -1;
        zoom = Math.max(1.35, Math.min(7, zoom * (1 + direction * 0.08)));
      }, { passive: false });

      function setModel(model) {
        disposeModel(activeModel);
        activeModel = model;
        if (!activeModel) {
          return;
        }

        for (const geometry of activeModel.geometries) {
          const positionBuffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
          gl.bufferData(gl.ARRAY_BUFFER, geometry.positions, gl.STATIC_DRAW);

          const normalBuffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
          gl.bufferData(gl.ARRAY_BUFFER, geometry.normals, gl.STATIC_DRAW);
          geometry.preview = { positionBuffer, normalBuffer };
        }

        const physicalScaleMatrix = makePhysicalScaleMatrix(activeModel.bounds, INCHES_TO_METERS);
        for (const item of activeModel.renderItems) {
          item.previewMatrix = new Float32Array(item.normalizedMatrix);
          item.physicalMatrix = new Float32Array(16);
          item.xrMatrix = new Float32Array(16);
          math.multiply(item.physicalMatrix, physicalScaleMatrix, item.worldMatrix);
        }

        yaw = -0.72;
        pitch = -0.34;
        zoom = 2.9;
      }

      function disposeModel(model) {
        if (!model) {
          return;
        }

        for (const geometry of model.geometries || []) {
          if (geometry.preview) {
            gl.deleteBuffer(geometry.preview.positionBuffer);
            gl.deleteBuffer(geometry.preview.normalBuffer);
            geometry.preview = null;
          }
        }
      }

      function start() {
        requestAnimationFrame(draw);
      }

      function draw() {
        if (xrSession) {
          return;
        }

        resizeCanvas();
        gl.viewport(0, 0, targetCanvas.width, targetCanvas.height);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        if (activeModel && activeModel.renderItems.length) {
          const aspect = Math.max(targetCanvas.width / Math.max(1, targetCanvas.height), 0.001);
          math.perspective(projection, Math.PI / 4, aspect, 0.01, 2000);

          const distance = Math.max(2, activeModel.radius * zoom);
          const cosPitch = Math.cos(pitch);
          const eye = [
            Math.sin(yaw) * cosPitch * distance,
            Math.sin(pitch) * distance,
            Math.cos(yaw) * cosPitch * distance
          ];
          math.lookAt(view, eye, [0, 0, 0], [0, 1, 0]);

          gl.useProgram(program);
          gl.uniformMatrix4fv(locations.projection, false, projection);
          gl.uniformMatrix4fv(locations.view, false, view);
          gl.uniform3f(locations.lightDirection, -0.42, 0.82, 0.48);

          for (const item of activeModel.renderItems) {
            const preview = item.geometry.preview;
            if (!preview) {
              continue;
            }
            gl.uniformMatrix4fv(locations.model, false, item.previewMatrix);
            gl.uniform4fv(locations.color, item.color);

            gl.bindBuffer(gl.ARRAY_BUFFER, preview.positionBuffer);
            gl.enableVertexAttribArray(locations.position);
            gl.vertexAttribPointer(locations.position, 3, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, preview.normalBuffer);
            gl.enableVertexAttribArray(locations.normal);
            gl.vertexAttribPointer(locations.normal, 3, gl.FLOAT, false, 0, 0);

            gl.drawArrays(gl.TRIANGLES, 0, item.geometry.vertexCount);
          }
        }

        requestAnimationFrame(draw);
      }

      async function startAR() {
        if (!activeModel || !activeModel.renderItems.length) {
          throw new Error("Load a model before opening AR.");
        }
        if (!navigator.xr || !navigator.xr.requestSession) {
          throw new Error("WebXR AR is unavailable on this device. Use Open Viewer for the 3D preview.");
        }
        if (xrSession) {
          await xrSession.end();
          return;
        }

        let session = null;
        try {
          if (gl.makeXRCompatible) {
            await gl.makeXRCompatible();
          }

          const sessionInit = {
            requiredFeatures: ["hit-test"],
            optionalFeatures: ["local-floor"]
          };

          session = await navigator.xr.requestSession("immersive-ar", sessionInit);
          xrSession = session;
          xrModelPlaced = false;
          xrReticleVisible = false;
          xrHitSeen = false;
          identity(xrHitMatrix);
          identity(xrPlacedMatrix);

          session.addEventListener("select", placeModelAtHit);
          session.addEventListener("end", () => {
            clearXRNoHitTimer();
            if (xrHitTestSource) {
              xrHitTestSource.cancel();
            }
            xrSession = null;
            xrReferenceSpace = null;
            xrViewerSpace = null;
            xrHitTestSource = null;
            xrModelPlaced = false;
            xrReticleVisible = false;
            xrHitSeen = false;
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            resizeCanvas();
            setStatus(`Loaded ${state.selectedFile}.`, "good");
            requestAnimationFrame(draw);
          }, { once: true });

          const layer = new XRWebGLLayer(session, gl, { alpha: true, antialias: true });
          session.updateRenderState({ baseLayer: layer });
          xrReferenceSpace = await session.requestReferenceSpace("local");
          xrViewerSpace = await session.requestReferenceSpace("viewer");
          xrHitTestSource = await session.requestHitTestSource({ space: xrViewerSpace });
          ensureReticleGeometry();
          setStatus("Scan for a surface, then tap to place at true size.", "good");
          startXRNoHitTimer();
          session.requestAnimationFrame(renderXRFrame);
        } catch (error) {
          clearXRNoHitTimer();
          if (session) {
            try {
              await session.end();
            } catch {
              // Session may already be ending.
            }
          }
          xrSession = null;
          xrReferenceSpace = null;
          xrViewerSpace = null;
          if (xrHitTestSource) {
            xrHitTestSource.cancel();
          }
          xrHitTestSource = null;
          xrModelPlaced = false;
          xrReticleVisible = false;
          xrHitSeen = false;
          throw error;
        }
      }

      function renderXRFrame(time, frame) {
        const session = frame.session;
        const pose = frame.getViewerPose(xrReferenceSpace);

        gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);
        if (pose) {
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          updateXRHitPose(frame);
          for (const xrView of pose.views) {
            const viewport = session.renderState.baseLayer.getViewport(xrView);
            gl.viewport(viewport.x, viewport.y, viewport.width, viewport.height);
            if (xrModelPlaced) {
              renderModel(xrView.projectionMatrix, xrView.transform.inverse.matrix, "physical");
            }
            if (xrReticleVisible) {
              renderReticle(xrView.projectionMatrix, xrView.transform.inverse.matrix);
            }
          }
        }

        if (xrSession) {
          session.requestAnimationFrame(renderXRFrame);
        }
      }

      function updateXRHitPose(frame) {
        xrReticleVisible = false;
        if (!xrHitTestSource) {
          return;
        }

        const hitTestResults = frame.getHitTestResults(xrHitTestSource);
        if (!hitTestResults.length) {
          return;
        }

        const hitPose = hitTestResults[0].getPose(xrReferenceSpace);
        if (!hitPose) {
          return;
        }

        copyInto(xrHitMatrix, hitPose.transform.matrix);
        xrReticleVisible = true;
        xrHitSeen = true;
        clearXRNoHitTimer();
      }

      function startXRNoHitTimer() {
        clearXRNoHitTimer();
        xrNoHitTimer = setTimeout(async () => {
          if (!xrSession || xrHitSeen) {
            return;
          }
          setStatus("No AR surface found. Try more light, texture, and slow movement.", "bad");
          try {
            await xrSession.end();
          } catch {
            // Session may already be ending.
          }
        }, 12000);
      }

      function clearXRNoHitTimer() {
        if (xrNoHitTimer) {
          clearTimeout(xrNoHitTimer);
          xrNoHitTimer = null;
        }
      }

      function placeModelAtHit() {
        if (!xrSession || !xrReticleVisible) {
          setStatus("Point at a detected surface before placing.", "");
          return;
        }

        copyInto(xrPlacedMatrix, xrHitMatrix);
        xrModelPlaced = true;
        setStatus("Placed true size. Tap another surface to move it.", "good");
      }

      function ensureReticleGeometry() {
        if (reticleGeometry) {
          return reticleGeometry;
        }

        const positions = [];
        const normals = [];
        const innerRadius = 0.12;
        const outerRadius = 0.135;
        const segments = 72;

        for (let i = 0; i < segments; i += 1) {
          const a0 = (i / segments) * Math.PI * 2;
          const a1 = ((i + 1) / segments) * Math.PI * 2;
          const ix0 = Math.cos(a0) * innerRadius;
          const iz0 = Math.sin(a0) * innerRadius;
          const ox0 = Math.cos(a0) * outerRadius;
          const oz0 = Math.sin(a0) * outerRadius;
          const ix1 = Math.cos(a1) * innerRadius;
          const iz1 = Math.sin(a1) * innerRadius;
          const ox1 = Math.cos(a1) * outerRadius;
          const oz1 = Math.sin(a1) * outerRadius;

          positions.push(ox0, 0, oz0, ix0, 0, iz0, ix1, 0, iz1);
          positions.push(ox0, 0, oz0, ix1, 0, iz1, ox1, 0, oz1);
        }

        for (let i = 0; i < positions.length / 3; i += 1) {
          normals.push(0, 1, 0);
        }

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

        const normalBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(normals), gl.STATIC_DRAW);

        reticleGeometry = {
          positionBuffer,
          normalBuffer,
          vertexCount: positions.length / 3
        };
        return reticleGeometry;
      }

      function renderReticle(projectionMatrix, viewMatrix) {
        const geometry = ensureReticleGeometry();

        gl.useProgram(program);
        gl.uniformMatrix4fv(locations.projection, false, projectionMatrix);
        gl.uniformMatrix4fv(locations.view, false, viewMatrix);
        gl.uniformMatrix4fv(locations.model, false, xrHitMatrix);
        gl.uniform4f(locations.color, 0.2, 0.9, 0.72, 0.84);
        gl.uniform3f(locations.lightDirection, -0.2, 0.9, 0.4);

        gl.bindBuffer(gl.ARRAY_BUFFER, geometry.positionBuffer);
        gl.enableVertexAttribArray(locations.position);
        gl.vertexAttribPointer(locations.position, 3, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, geometry.normalBuffer);
        gl.enableVertexAttribArray(locations.normal);
        gl.vertexAttribPointer(locations.normal, 3, gl.FLOAT, false, 0, 0);

        gl.drawArrays(gl.TRIANGLES, 0, geometry.vertexCount);
      }

      function renderModel(projectionMatrix, viewMatrix, mode) {
        if (!activeModel || !activeModel.renderItems.length) {
          return;
        }

        gl.useProgram(program);
        gl.uniformMatrix4fv(locations.projection, false, projectionMatrix);
        gl.uniformMatrix4fv(locations.view, false, viewMatrix);
        gl.uniform3f(locations.lightDirection, -0.42, 0.82, 0.48);

        for (const item of activeModel.renderItems) {
          const preview = item.geometry.preview;
          if (!preview) {
            continue;
          }

          const modelMatrix = mode === "physical" ? item.xrMatrix : item.previewMatrix;
          if (mode === "physical") {
            math.multiply(item.xrMatrix, xrPlacedMatrix, item.physicalMatrix);
          }

          gl.uniformMatrix4fv(locations.model, false, modelMatrix);
          gl.uniform4fv(locations.color, item.color);

          gl.bindBuffer(gl.ARRAY_BUFFER, preview.positionBuffer);
          gl.enableVertexAttribArray(locations.position);
          gl.vertexAttribPointer(locations.position, 3, gl.FLOAT, false, 0, 0);

          gl.bindBuffer(gl.ARRAY_BUFFER, preview.normalBuffer);
          gl.enableVertexAttribArray(locations.normal);
          gl.vertexAttribPointer(locations.normal, 3, gl.FLOAT, false, 0, 0);

          gl.drawArrays(gl.TRIANGLES, 0, item.geometry.vertexCount);
        }
      }

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.floor(targetCanvas.clientWidth * dpr));
        const height = Math.max(1, Math.floor(targetCanvas.clientHeight * dpr));
        if (targetCanvas.width !== width || targetCanvas.height !== height) {
          targetCanvas.width = width;
          targetCanvas.height = height;
        }
      }

      function makePhysicalScaleMatrix(bounds, scale) {
        const centerX = (bounds.min[0] + bounds.max[0]) * 0.5;
        const centerZ = (bounds.min[2] + bounds.max[2]) * 0.5;
        return new Float32Array([
          scale, 0, 0, 0,
          0, scale, 0, 0,
          0, 0, scale, 0,
          -centerX * scale, -bounds.min[1] * scale, -centerZ * scale, 1
        ]);
      }

      function identity(out) {
        out[0] = 1; out[1] = 0; out[2] = 0; out[3] = 0;
        out[4] = 0; out[5] = 1; out[6] = 0; out[7] = 0;
        out[8] = 0; out[9] = 0; out[10] = 1; out[11] = 0;
        out[12] = 0; out[13] = 0; out[14] = 0; out[15] = 1;
        return out;
      }

      function copyInto(target, source) {
        for (let i = 0; i < 16; i += 1) {
          target[i] = source[i];
        }
        return target;
      }

      return { setModel, start, startAR };
    }

    function createProgram(gl, vertexSource, fragmentSource) {
      const vertex = createShader(gl, gl.VERTEX_SHADER, vertexSource);
      const fragment = createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
      const program = gl.createProgram();
      gl.attachShader(program, vertex);
      gl.attachShader(program, fragment);
      gl.linkProgram(program);
      gl.deleteShader(vertex);
      gl.deleteShader(fragment);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program) || "Could not link preview shader.");
      }
      return program;
    }

    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader) || "Could not compile preview shader.");
      }
      return shader;
    }

    boot();
  })();
  </script>
</body>
